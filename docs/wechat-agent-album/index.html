<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图解Agent · 文章导航</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #6c7b80;
      --line: #d7e0e2;
      --panel: #f7faf9;
      --paper: #fffefb;
      --accent: #d66b45;
      --accent-soft: #f7e2d8;
      --teal: #216d73;
      --shadow: 0 14px 42px rgba(26, 47, 52, .12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #e9eff0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: minmax(286px, 338px) minmax(0, 1fr);
      height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      color: #f4f8f7;
      background: #16272b;
      border-right: 1px solid rgba(255, 255, 255, .08);
    }

    .brand {
      padding: 28px 24px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #efb092;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin: 0; }
    .brand h1 {
      font-family: Georgia, "Songti SC", serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.18;
    }

    .brand-copy {
      margin-top: 12px;
      color: #b6c7c8;
      font-size: 13px;
      line-height: 1.6;
    }

    .search-wrap { padding: 16px 18px 10px; }
    .search {
      width: 100%;
      padding: 11px 13px;
      color: var(--ink);
      background: #f5f8f7;
      border: 1px solid transparent;
      border-radius: 7px;
      outline: none;
    }
    .search:focus { border-color: #efb092; box-shadow: 0 0 0 3px rgba(239, 176, 146, .18); }
    .count {
      padding: 0 20px 10px;
      color: #91a8aa;
      font-size: 12px;
    }

    .article-list {
      min-height: 0;
      padding: 0 10px 18px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #49676a transparent;
    }

    .article-button {
      display: block;
      width: 100%;
      padding: 13px 12px 13px 14px;
      color: #d9e5e3;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0 6px 6px 0;
    }
    .article-button:hover { background: rgba(255, 255, 255, .07); }
    .article-button.active {
      color: #fff;
      background: rgba(214, 107, 69, .18);
      border-left-color: var(--accent);
    }
    .article-number {
      display: inline-block;
      width: 28px;
      color: #8ba4a5;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      vertical-align: top;
    }
    .article-button.active .article-number { color: #efb092; }
    .article-title {
      display: inline;
      font-size: 13px;
      line-height: 1.55;
    }

    .reader {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 18px;
    }

    .reader-shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 76px;
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .current-meta { min-width: 0; }
    .current-kicker {
      margin-bottom: 5px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
    }
    .current-title {
      max-width: 720px;
      overflow: hidden;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls { display: flex; gap: 8px; flex: 0 0 auto; }
    .control {
      width: 36px;
      height: 36px;
      color: var(--teal);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .control:hover:not(:disabled) { color: #fff; background: var(--teal); border-color: var(--teal); }
    .control:disabled { cursor: not-allowed; opacity: .35; }

    .reader-frame {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      border: 0;
      background: #fff;
    }

    .empty {
      padding: 28px 20px;
      color: #a9b7b8;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { display: block; height: auto; min-height: 100vh; }
      .sidebar { height: 43vh; min-height: 320px; }
      .reader { height: 65vh; min-height: 520px; padding: 10px; }
      .reader-bar { min-height: 72px; padding: 12px; }
      .current-title { max-width: 46vw; white-space: normal; }
      .brand { padding: 20px 18px 16px; }
      .brand h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="文章导航">
      <header class="brand">
        <p class="eyebrow">Offline Reading Desk</p>
        <h1>图解Agent</h1>
        <p class="brand-copy">22 篇文章 · 单页导航阅读<br>内容和图片均来自本地归档</p>
      </header>
      <div class="search-wrap">
        <input id="search" class="search" type="search" placeholder="搜索标题" aria-label="搜索文章标题">
      </div>
      <p id="count" class="count"></p>
      <nav id="article-list" class="article-list" aria-label="文章列表"></nav>
    </aside>

    <main class="reader">
      <section class="reader-shell" aria-label="文章阅读区">
        <header class="reader-bar">
          <div class="current-meta">
            <p id="current-kicker" class="current-kicker"></p>
            <h2 id="current-title" class="current-title"></h2>
          </div>
          <div class="controls" aria-label="文章切换">
            <button id="prev" class="control" type="button" title="上一篇" aria-label="上一篇">←</button>
            <button id="next" class="control" type="button" title="下一篇" aria-label="下一篇">→</button>
          </div>
        </header>
        <iframe id="reader-frame" class="reader-frame" title="文章内容"></iframe>
      </section>
    </main>
  </div>

    const list = document.getElementById('article-list');
    const search = document.getElementById('search');
    const count = document.getElementById('count');
    const frame = document.getElementById('reader-frame');
    const currentKicker = document.getElementById('current-kicker');
    const currentTitle = document.getElementById('current-title');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let currentPosition = 22;

    function getPositionFromHash() {
      const value = Number.parseInt(location.hash.replace('#article-', ''), 10);
      return Number.isInteger(value) && value >= 1 && value <= articles.length ? value : 22;
    }

    function renderList() {
      const query = search.value.trim().toLowerCase();
      const visible = articles.filter(article => article.title.toLowerCase().includes(query));
      count.textContent = query ? `${visible.length} / ${articles.length} 篇` : `${articles.length} 篇内容 · 连载中`;
      list.innerHTML = '';
      if (!visible.length) {
        list.innerHTML = '<p class="empty">没有匹配的文章</p>';
        return;
      }
      visible.forEach(article => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `article-button${article.position === currentPosition ? ' active' : ''}`;
        button.dataset.position = article.position;
        button.innerHTML = `<span class="article-number">${String(article.position).padStart(2, '0')}</span><span class="article-title"></span>`;
        button.querySelector('.article-title').textContent = article.title;
        button.addEventListener('click', () => openArticle(article.position));
        list.appendChild(button);
      });
    }

    function openArticle(position, updateHash = true) {
      const article = articles.find(item => item.position === position) || articles[articles.length - 1];
      currentPosition = article.position;
      frame.src = article.file;
      currentKicker.textContent = `${String(article.position).padStart(2, '0')} / ${String(articles.length).padStart(2, '0')} · ${article.date}`;
      currentTitle.textContent = article.title;
      prev.disabled = article.position === 1;
      next.disabled = article.position === articles.length;
      if (updateHash) history.replaceState(null, '', `#article-${article.position}`);
      renderList();
    }

    search.addEventListener('input', renderList);
    prev.addEventListener('click', () => openArticle(currentPosition - 1));
    next.addEventListener('click', () => openArticle(currentPosition + 1));
    window.addEventListener('hashchange', () => openArticle(getPositionFromHash(), false));
    openArticle(getPositionFromHash(), false);
  </script>
